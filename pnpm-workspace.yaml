packages:
  - "apps/*"
  - "packages/*"
  - "functions"

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Postinstall scripts pnpm blocks by default (supply-chain hardening). These are
# well-known packages that need their native/build step to work correctly:
#   @firebase/util  — Firebase SDK internal, dependency of firebase/firebase-admin
#   esbuild         — downloads its platform-specific native binary on install
#   protobufjs      — used by firebase-admin/grpc for protobuf (de)serialization
#   sharp           — native image processing, used by Next.js image optimization
#   unrs-resolver   — native (Rust) module resolver used by ESLint tooling
onlyBuiltDependencies:
  - "@firebase/util"
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver

# react/react-dom (the runtime packages) are scoped to merchant-dashboard only, so the Expo
# apps keep resolving their own React 18.3.1 (required by React Native 0.76's peer range).
# @types/react and @types/react-dom are pinned workspace-wide instead of scoped: Next.js's
# own generated .next/types kept resolving a second, slightly newer copy of @types/react than
# the one merchant-dashboard requested, and TS treated the two copies' JSX.Element/ReactNode
# as structurally incompatible. Being type-only, this has no runtime effect on the Expo apps
# even though it also touches their type layer.
overrides:
  "@delivery/merchant-dashboard>react": 19.0.0
  "@delivery/merchant-dashboard>react-dom": 19.0.0
  "@types/react": 19.0.4
  "@types/react-dom": 19.0.2
